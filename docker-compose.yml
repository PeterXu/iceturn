version: '3.8'

services:
  iceturn:
    build:
      context: .
      dockerfile: Dockerfile
    image: iceturn:latest
    container_name: iceturn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
    environment:
      - REALM=magpie.local
      - PUBLIC_IP=${PUBLIC_IP:-127.0.0.1}
      - STUN_PENDING_TIMEOUT=30s
      - TURN_CREDENTIALS=magpie:magpie
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/var/log/iceturn
    networks:
      - magpie-network
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 3478 && nc -zu -w1 localhost 3478"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  magpie-network:
    driver: bridge
    # If magpie also uses docker-compose, join its network
    # external: true
    # name: magpie_default
